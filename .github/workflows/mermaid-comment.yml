name: Graph Mermaid PR Comment

# Reusable workflow that generates Mermaid diagrams from Starlark schemas and posts
# them as PR comments. Fork-safe two-stage design: build stage has read-only perms,
# comment stage uses caller's GITHUB_TOKEN.
#
# Usage from caller repos:
#   jobs:
#     graph:
#       uses: project-kessel/schema-graph-tools/.github/workflows/mermaid-comment.yml@main
#       with:
#         schema-path: schema
#       secrets: inherit

on:
  workflow_call:
    inputs:
      schema-path:
        description: 'Path to schema directory (relative to repo root)'
        required: false
        type: string
        default: 'schema'
      ref:
        description: 'Git ref to checkout (defaults to PR head)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-mermaid:
    name: Build Mermaid Diagram
    runs-on: ubuntu-latest
    # Read-only permissions for fork safety
    permissions:
      contents: read

    steps:
      - name: Checkout schema-graph-tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: project-kessel/schema-graph-tools
          path: schema-graph-tools

      - name: Checkout caller repo (PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: caller-repo
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: schema-graph-tools/go.mod
          cache-dependency-path: schema-graph-tools/go.sum

      - name: Build graph tools
        working-directory: schema-graph-tools
        run: |
          # Fetch schema from GitHub
          make fetch-schema

          # Build graph tools
          make build-graph-mermaid build-compile-schema

      - name: Compile schema to graph.json
        working-directory: schema-graph-tools
        run: |
          ./bin/compile-schema "../caller-repo/${{ inputs.schema-path }}" > /tmp/graph.json

      - name: Generate Mermaid diagram
        working-directory: schema-graph-tools
        run: |
          ./bin/graph-mermaid -in /tmp/graph.json -out /tmp/graph.mmd

      - name: Upload Mermaid artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mermaid-diagram
          path: /tmp/graph.mmd
          retention-days: 1

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.number }}" > /tmp/pr-number.txt

      - name: Upload PR metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-metadata
          path: /tmp/pr-number.txt
          retention-days: 1

  comment-mermaid:
    name: Post PR Comment
    needs: build-mermaid
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Write permissions for PR comments (uses caller's token)
    permissions:
      pull-requests: write

    steps:
      - name: Download Mermaid artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mermaid-diagram

      - name: Download PR metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-metadata

      - name: Read PR number
        id: pr
        run: |
          echo "number=$(cat pr-number.txt)" >> $GITHUB_OUTPUT

      - name: Create comment body
        id: comment-body
        run: |
          cat > comment.md <<'EOF'
          ## Schema Graph Visualization

          ```mermaid
          EOF
          cat graph.mmd >> comment.md
          cat >> comment.md <<'EOF'
          ```

          ---
          <sub>Generated by [schema-graph-tools](https://github.com/project-kessel/schema-graph-tools) • [View playground](https://project-kessel.github.io/schema-graph-tools/)</sub>
          EOF

          # Save as multiline output
          {
            echo 'body<<EOF'
            cat comment.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Find existing comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: find-comment
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Schema Graph Visualization'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: ${{ steps.comment-body.outputs.body }}
          edit-mode: replace
