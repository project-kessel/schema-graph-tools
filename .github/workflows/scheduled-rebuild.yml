name: Scheduled Rebuild

# Tracks starlark-unified-schema@main and rebuilds graph playground when it changes
on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout schema-graph-tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: schema-graph-tools

      - name: Set up latest stable Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: schema-graph-tools/go.sum

      - name: Fetch latest schema and synchronize module requirements
        working-directory: schema-graph-tools
        run: |
          make refresh-schema
          # Upstream main may require a newer Go version or new dependencies.
          # Update only this disposable checkout; no changes are committed.
          make sync-deps

      - name: Build graph tools
        working-directory: schema-graph-tools
        run: |
          # Build playground (builds binaries + generates index.html)
          make graph-playground

          # Verify build succeeded
          test -f output/playground/index.html || { echo "error: index.html not generated" >&2; exit 1; }
          test -f output/playground/graph-playground.wasm || { echo "error: graph-playground.wasm not built" >&2; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: schema-graph-tools/output/playground

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
