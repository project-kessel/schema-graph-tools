name: Scheduled Rebuild

# Tracks starlark-unified-schema@main and rebuilds graph playground when it changes
on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout schema-graph-tools
        uses: actions/checkout@v4
        with:
          path: schema-graph-tools

      - name: Checkout starlark-unified-schema@main
        uses: actions/checkout@v4
        with:
          repository: project-kessel/starlark-unified-schema
          path: starlark-unified-schema
          # No token needed - public repo

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: schema-graph-tools/go.mod
          cache-dependency-path: schema-graph-tools/go.sum

      - name: Build graph tools
        working-directory: schema-graph-tools
        run: |
          # Wire the replace directive to local checkout
          go mod edit -replace=github.com/project-kessel/starlark-unified-schema=../starlark-unified-schema/interpreter

          # Build playground
          make build-graph-playground build-graph-wasm

          # Verify build succeeded
          test -f output/playground/index.html
          test -f output/playground/graph-playground.wasm

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: schema-graph-tools/output/playground

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
