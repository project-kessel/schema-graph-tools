name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout schema-graph-tools
        uses: actions/checkout@v4
        with:
          path: schema-graph-tools

      - name: Checkout starlark-unified-schema
        uses: actions/checkout@v4
        with:
          repository: project-kessel/starlark-unified-schema
          path: starlark-unified-schema

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: schema-graph-tools/go.mod
          cache-dependency-path: schema-graph-tools/go.sum

      - name: Wire replace directive
        working-directory: schema-graph-tools
        run: |
          go mod edit -replace=github.com/project-kessel/starlark-unified-schema=../starlark-unified-schema/interpreter

      - name: Build
        working-directory: schema-graph-tools
        run: go build ./...

      - name: Test
        working-directory: schema-graph-tools
        env:
          SCHEMA_DIR: ../starlark-unified-schema/schema
        run: go test -v ./...
